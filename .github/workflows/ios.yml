name: iOS

# This repo is authored in an environment with no Swift toolchain and no Xcode,
# so CI is the compiler. Every push gets built on a real Mac.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coffeekit:
    name: CoffeeKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      # CoffeeKit is pure Foundation precisely so this step needs no simulator,
      # no signing and no project file. If the diagnosis engine is wrong, it
      # fails here in about twenty seconds.
      - name: Test the domain layer
        run: swift test --package-path Packages/CoffeeKit

  app:
    name: Build app + widgets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # Code signing off: this proves the code compiles and the widget extension
      # embeds, without needing a Team ID in CI.
      #
      # xcodebuild's default output buries a one-line compiler error under a
      # thousand lines of frontend invocation, which makes a red build far more
      # expensive to diagnose than it should be. Capture it and print only what
      # is actually wrong.
      - name: Build for the simulator
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project Grind.xcodeproj \
            -scheme Grind \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          then
            echo "::group::Compiler errors"
            grep -E "error:" build.log | sed 's|/Users/runner/work/coffee/coffee/||' | sort -u | head -60
            echo "::endgroup::"
            echo "::group::Last 40 lines"
            tail -40 build.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Build succeeded."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5
